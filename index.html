<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>东京 8日 · 花火 + 富士</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
--bg:#1a1a1a;--card:#252525;--border:#333;--text:#e0e0e0;--text2:#999;
--red:#ff3b30;--blue:#007aff;--orange:#ff9500;--green:#34c759;--purple:#af52de;--sky:#5ac8fa;--grey:#86868b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro','PingFang SC',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#map{flex:1;z-index:1}
#panel{background:var(--card);border-top:1px solid var(--border);max-height:55vh;overflow-y:auto;z-index:2;-webkit-overflow-scrolling:touch}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:3}
.tabs button{flex-shrink:0;background:none;border:none;color:var(--text2);padding:10px 14px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.tabs button.active{color:var(--text);border-bottom-color:var(--blue)}
.day-content{padding:12px 16px;display:none}
.day-content.active{display:block}
.day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-header h3{font-size:15px}
.day-header .date{font-size:11px;color:var(--text2)}
.stop{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;align-items:flex-start}
.stop:hover{background:rgba(255,255,255,0.03);border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px}
.stop .time{font-size:12px;font-weight:600;min-width:44px;color:var(--text)}
.stop .info{flex:1;min-width:0}
.stop .info .name{font-size:12px;font-weight:600}
.stop .info .desc{font-size:10px;color:var(--text2);margin-top:1px;line-height:1.4}
.stop .tag{font-size:8px;padding:1px 5px;border-radius:6px;border:1px solid var(--border);color:var(--text2);white-space:nowrap;flex-shrink:0}
.stop .tag.food{color:var(--orange);border-color:var(--orange)}.stop .tag.spot{color:var(--blue);border-color:var(--blue)}
.stop .tag.hotel{color:var(--purple);border-color:var(--purple)}.stop .tag.transport{color:var(--grey);border-color:var(--grey)}
.stop .tag.drink{color:var(--green);border-color:var(--green)}.stop .tag.jdm{color:var(--red);border-color:var(--red)}
.summary{padding:16px;display:none}
.summary.active{display:block}
.summary .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.summary .info-card{background:rgba(255,255,255,0.03);padding:10px;border-radius:8px;border:1px solid var(--border)}
.summary .info-card .lbl{font-size:9px;color:var(--text2);text-transform:uppercase}
.summary .info-card .val{font-size:12px;line-height:1.4;margin-top:2px}
.summary table{width:100%;border-collapse:collapse;font-size:11px;margin:12px 0}
.summary td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.summary td:last-child{text-align:right}
.summary .total{font-weight:700}
.note{padding:12px;background:rgba(255,59,48,0.08);border:1px solid rgba(255,59,48,0.15);border-radius:8px;font-size:10px;color:var(--text2);line-height:1.5}
.note strong{color:var(--red)}
.nav-btn{position:absolute;top:10px;right:10px;z-index:1000;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;display:none}
.leaflet-popup-content{font-family:inherit;font-size:12px;margin:8px 12px;line-height:1.4}
.leaflet-popup-content strong{display:block;margin-bottom:2px}
.leaflet-popup-content span{color:#666;font-size:10px}
.map-tip{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,0.8);color:var(--text);padding:6px 14px;border-radius:16px;font-size:11px;pointer-events:none;opacity:0;transition:opacity 0.3s}
.map-tip.show{opacity:1}
</style>
</head>

{n:'东京塔夜景',t:'spot',ti:'21:00',d:'Main Deck · 最后入场23:00',lat:35.6586,lng:139.7454,b:'¥1,200'}
]},

{n:'羽田机场 T2',t:'transport',ti:'09:15',d:'NH923 羽田→广州 · 06:00起床 · Bass超大托运',lat:35.552,lng:139.7799,b:'已购'}
]}
];

const map = L.map('map',{zoomControl:false}).setView([35.68,139.76],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; <a href="https://carto.com/">CARTO</a>',maxZoom:19}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

const markers = {};
const markerGroup = L.layerGroup().addTo(map);
const routeGroup = L.layerGroup().addTo(map);

// Build markers for all days
const allDays = DAYS.slice(1);
allDays.forEach(day => {
day.markers = [];
day.locs.forEach((loc,i) => {
const m = L.marker([loc.lat,loc.lng],{icon:ICONS[loc.t]||ICONS.spot}).bindPopup(`<strong>${loc.n}</strong><span>${loc.ti||''} · ${day.label}</span><br>${loc.d||''}`);
markers[`${day.id}_${i}`] = m;
day.markers.push(m);
});
});

// Hotel marker (always visible)
const hotelM = L.marker([hotel.lat,hotel.lng],{icon:L.divIcon({html:'<div style="width:16px;height:16px;border-radius:50%;background:#af52de;border:3px solid rgba(255,255,255,0.5);box-shadow:0 0 10px #af52de88"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]})}).bindPopup('<strong>FRESA INN 上野御徒町</strong><br>¥9,000/晚').addTo(map);

// Show day's markers
function showDay(dayId){
markerGroup.clearLayers();
routeGroup.clearLayers();
if(dayId===0){
allDays.forEach(d=>d.markers.forEach(m=>markerGroup.addLayer(m)));
const allLocs = allDays.flatMap(d=>d.locs);
allLocs.forEach((loc,i,arr)=>{
if(i>0&&arr[i-1].lat&&loc.lat){
L.polyline([[arr[i-1].lat,arr[i-1].lng],[loc.lat,loc.lng]],{color:COLORS[loc.t]||'#888',weight:1,opacity:0.3,dashArray:'4 4'}).addTo(routeGroup);
}
});
try{map.fitBounds(L.latLngBounds(allLocs.map(l=>[l.lat,l.lng])).pad(0.1));}catch(e){}
}else{
const day = DAYS[dayId];
day.markers.forEach(m=>markerGroup.addLayer(m));
day.locs.forEach((loc,i)=>{
if(i>0&&day.locs[i-1].lat&&loc.lat){
L.polyline([[day.locs[i-1].lat,day.locs[i-1].lng],[loc.lat,loc.lng]],{color:day.color,weight:2,opacity:0.7}).addTo(routeGroup);
}
});
try{map.fitBounds(L.latLngBounds(day.locs.map(l=>[l.lat,l.lng])).pad(0.15));}catch(e){}
}
}

</div>
`;
panel.appendChild(summaryDiv);

// Day panels
DAYS.slice(1).forEach(day => {
const div = document.createElement('div');
div.className = 'day-content';
div.id = `day-panel-${day.id}`;
let stops = day.locs.map((loc,i) => `
<div class="stop" data-day="${day.id}" data-idx="${i}">
<span class="time">${loc.ti||'—'}</span>
<div class="info">
<div class="name">${loc.n}</div>
<div class="desc">${loc.d||''}</div>
${loc.b?`<div style="font-size:10px;color:var(--text2);margin-top:1px">${loc.b}</div>`:''}
</div>
<span class="tag ${loc.t}">${loc.t==='food'?'餐':loc.t==='spot'?'景点':loc.t==='hotel'?'酒店':loc.t==='transport'?'交通':loc.t==='drink'?'酒吧':loc.t==='jdm'?'JDM':loc.t==='shop'?'乐器':loc.t==='pickup'?'取件':loc.t}</span>
</div>
`).join('');
div.innerHTML = `<div class="day-header"><h3>${day.title}</h3><span class="date">${day.date}</span></div>${stops}`;
panel.appendChild(div);
});

// Tab switching
let activeDay = 0;
showDay(0);

tabsContainer.addEventListener('click', e => {
if(e.target.tagName==='BUTTON'){
const dayId = parseInt(e.target.dataset.day);
activeDay = dayId;
tabsContainer.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
panel.querySelectorAll('.day-content,.summary').forEach(d=>d.classList.remove('active'));
if(dayId===0)document.getElementById('summary-panel').classList.add('active');
else{
const dp = document.getElementById(`day-panel-${dayId}`);
if(dp)dp.classList.add('active');
}
showDay(dayId);
}
});

// Click on stop to focus map
panel.addEventListener('click', e => {
const stop = e.target.closest('.stop');
if(stop){
const dayId = parseInt(stop.dataset.day);
const idx = parseInt(stop.dataset.idx);
const key = `${dayId}_${idx}`;
const m = markers[key];
if(m){
map.setView(m.getLatLng(),16);
m.openPopup();
}
}
});

// Tip
const tip = document.getElementById('tip');
tip.classList.add('show');
setTimeout(()=>tip.classList.remove('show'),5000);

// Responsive: tap map to hide tip
map.on('click',()=>tip.classList.remove('show'));
</script>
</body>
</html>
